<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#475569;stroke-width:1.3;rx:8}
      .host{fill:#eef6ff}.agent{fill:#f0fdf4}.app{fill:#fff7ed}
      .t{font-weight:600;fill:#0f172a}.s{fill:#334155;font-size:12px}
      .l{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .n{fill:#475569;font-size:11.5px}
    </style>
  </defs>
  <rect width="920" height="470" fill="#ffffff"/>
  <rect class="box host" x="20" y="20" width="250" height="78"/>
  <text class="t" x="34" y="44">main.py</text>
  <text class="s" x="34" y="63">options, profile, sandbox check,</text>
  <text class="s" x="34" y="80">report (.arc/run.json), exit code</text>

  <rect class="box host" x="20" y="126" width="250" height="96"/>
  <text class="t" x="34" y="150">application_agent.py</text>
  <text class="s" x="34" y="169">one session per application</text>
  <text class="s" x="34" y="186">runtime/persistence.py: session.json,</text>
  <text class="s" x="34" y="203">events, resume, Git checkpoints</text>

  <rect class="box agent" x="330" y="20" width="270" height="202"/>
  <text class="t" x="344" y="44">runtime/ — agent session</text>
  <text class="s" x="344" y="65">loop.py: model → tool calls → observations</text>
  <text class="s" x="344" y="84">model.py: OpenAI-compatible client</text>
  <text class="s" x="344" y="103">tools.py, files.py, requirements.py</text>
  <text class="s" x="344" y="122">execution.py: mirror + sandbox</text>
  <text class="s" x="344" y="141">browser.py: loopback-only Playwright</text>
  <text class="s" x="344" y="160">context.py: compaction</text>
  <text class="s" x="344" y="179">budget.py: limits, stagnation</text>
  <text class="s" x="344" y="198">config.py + profiles/: instructions, limits</text>

  <rect class="box host" x="330" y="262" width="270" height="186"/>
  <text class="t" x="344" y="286">verification/ — host decides</text>
  <text class="s" x="344" y="307">driver.py: proposal → verify → repair</text>
  <text class="s" x="344" y="326">verifier.py: integrity, build, start,</text>
  <text class="s" x="344" y="343">  acceptance, visual; clean round</text>
  <text class="s" x="344" y="362">acceptance.py: external + generated tests</text>
  <text class="s" x="344" y="381">checks.py: typecheck, build, HTTP, SQL</text>
  <text class="s" x="344" y="400">coverage.py: claims vs. proofs</text>
  <text class="s" x="344" y="419">visual.py: capture vs. reference</text>

  <rect class="box app" x="660" y="20" width="240" height="96"/>
  <text class="t" x="674" y="44">INPUT (read-only)</text>
  <text class="s" x="674" y="63">requirements.yaml, reference images,</text>
  <text class="s" x="674" y="80">tests/*.spec.ts</text>
  <text class="s" x="674" y="99">requirements/normalize.py</text>

  <rect class="box app" x="660" y="146" width="240" height="96"/>
  <text class="t" x="674" y="170">OUTPUT — application</text>
  <text class="s" x="674" y="189">frontend/, backend/, deploy.sh</text>
  <text class="s" x="674" y="206">from shared/project/templates</text>
  <text class="s" x="674" y="225">.arc/run.json</text>

  <rect class="box app" x="660" y="272" width="240" height="176"/>
  <text class="t" x="674" y="296">STATE/SESSION_ID (host-owned)</text>
  <text class="s" x="674" y="315">session.json, events.jsonl</text>
  <text class="s" x="674" y="332">run-summary.json</text>
  <text class="s" x="674" y="349">artifacts/, process-logs/</text>
  <text class="s" x="674" y="366">execution/ — sandbox mirror,</text>
  <text class="s" x="674" y="383">  node_modules, databases</text>
  <text class="s" x="674" y="408">STATE/_tooling/ — acceptance runner</text>
  <text class="s" x="674" y="425">  and its isolated test suites</text>

  <path class="l" d="M145 98V126"/>
  <path class="l" d="M270 160H330"/>
  <path class="l" d="M465 222V262"/>
  <text class="n" x="472" y="246">final reply = proposal</text>
  <path class="l" d="M330 330H300V190H330"/>
  <text class="n" x="196" y="262">failures return to</text>
  <text class="n" x="196" y="277">the same session</text>
  <path class="l" d="M660 68H600"/>
  <path class="l" d="M600 180H660"/>
  <path class="l" d="M600 350H660"/>
  <path class="l" d="M600 130C630 130 630 300 660 300"/>
</svg>
